<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>P2P Storage Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* --- GLOBAL THEME --- */
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: radial-gradient(circle at top left, #0b0f19, #000);
      color: #e2e8f0;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 32px;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-weight: 700;
      background: linear-gradient(90deg, #8b5cf6, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 6px;
      font-weight: 600;
      color: #cbd5e1;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
      color: #e2e8f0;
      box-sizing: border-box;
      transition: 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    /* --- BUTTONS (Web3 gradient style) --- */
    button {
      margin-top: 18px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6, #06b6d4);
      background-size: 200% 200%;
      transition: 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      background-position: right;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #93c5fd;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    button.secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
      box-shadow: none;
      transform: none;
    }

    .section-title {
      margin-top: 28px;
      padding-bottom: 6px;
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    pre {
      background: rgba(15, 23, 42, 0.85);
      padding: 16px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.4);
      overflow-x: auto;
      font-size: 0.9rem;
      color: #e2e8f0;
    }

    .pill {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      background: linear-gradient(90deg, #6366f1, #3b82f6);
      color: #000915;
      margin-right: 6px;
      font-weight: 600;
    }

    a.download-link {
      display: inline-block;
      margin-top: 10px;
      margin-right: 12px;
      font-size: 0.9rem;
      color: #22c55e;
      font-weight: 600;
      text-decoration: none;
      transition: 0.25s;
    }

    a.download-link:hover {
      color: #67e8f9;
      text-shadow: 0 0 6px #67e8f9;
    }

    #status {
      margin-top: 10px;
      font-size: 0.95rem;
      min-height: 1.2em;
      font-weight: 600;
    }

    .error {
      color: #fb7185;
    }

    .success {
      color: #4ade80;
    }

    code {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>P2P Storage + Blockchain Demo</h1>

    <form id="uploadForm">
      <label for="owner">Owner address (Ganache account)</label>
      <input
        type="text"
        id="owner"
        placeholder="0x... (paste an account from ganache-cli)"
        required
      />

      <label for="file">Choose file</label>
      <input type="file" id="file" required />

      <button type="submit" id="uploadBtn">Upload to P2P network</button>
    </form>

    <div id="status"></div>

    <div id="resultSection" style="display:none;">
      <div class="section-title">Last uploaded file</div>
      <p><span class="pill">File ID</span> <code id="fileIdText"></code></p>
      <p><span class="pill">File hash</span> <code id="fileHashText"></code></p>
      <p><span class="pill">Size</span> <span id="fileSizeText"></span> bytes</p>

      <button id="refreshMetaBtn" class="secondary">Refresh metadata</button>
      <button id="refreshNodesBtn" class="secondary">Refresh nodes</button>

      <div class="section-title">On-chain metadata</div>
      <pre id="metadataPre">{}</pre>

      <div class="section-title">Replica nodes</div>
      <pre id="nodesPre">{}</pre>

      <div id="downloadLinks"></div>
    </div>
  </div>

  <script>
    const uploadForm = document.getElementById("uploadForm");
    const ownerInput = document.getElementById("owner");
    const fileInput = document.getElementById("file");
    const uploadBtn = document.getElementById("uploadBtn");
    const statusEl = document.getElementById("status");

    const resultSection = document.getElementById("resultSection");
    const fileIdText = document.getElementById("fileIdText");
    const fileHashText = document.getElementById("fileHashText");
    const fileSizeText = document.getElementById("fileSizeText");
    const metadataPre = document.getElementById("metadataPre");
    const nodesPre = document.getElementById("nodesPre");
    const downloadLinks = document.getElementById("downloadLinks");
    const refreshMetaBtn = document.getElementById("refreshMetaBtn");
    const refreshNodesBtn = document.getElementById("refreshNodesBtn");

    let lastFileId = null;

    function setStatus(msg, type = "") {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    uploadForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const owner = ownerInput.value.trim();
      const file = fileInput.files[0];

      if (!owner || !file) {
        setStatus("Owner address and file are required.", "error");
        return;
      }

      try {
        uploadBtn.disabled = true;
        setStatus("Uploading...", "");

        const formData = new FormData();
        formData.append("owner", owner);
        formData.append("file", file);

        const res = await fetch("/upload", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        if (!res.ok || !data.ok) {
          console.error("Upload error:", data);
          setStatus("Upload failed: " + (data.error || "Unknown error"), "error");
          uploadBtn.disabled = false;
          return;
        }

        lastFileId = data.fileId;
        fileIdText.textContent = data.fileId;
        fileHashText.textContent = data.fileHash;
        fileSizeText.textContent = data.size;

        resultSection.style.display = "block";
        setStatus("Upload successful!", "success");

        // Immediately fetch metadata + nodes
        await refreshMetadata();
        await refreshNodes();
      } catch (err) {
        console.error(err);
        setStatus("Upload failed: " + err.message, "error");
      } finally {
        uploadBtn.disabled = false;
      }
    });

    async function refreshMetadata() {
      if (!lastFileId) return;
      try {
        const res = await fetch(`/file/${lastFileId}`);
        const data = await res.json();
        metadataPre.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        console.error(err);
        metadataPre.textContent = "Error: " + err.message;
      }
    }

    async function refreshNodes() {
      if (!lastFileId) return;
      try {
        const res = await fetch(`/file/${lastFileId}/nodes`);
        const data = await res.json();
        nodesPre.textContent = JSON.stringify(data, null, 2);

        downloadLinks.innerHTML = "";
        if (data.nodes && Array.isArray(data.nodes)) {
          data.nodes.forEach((node, idx) => {
            const a = document.createElement("a");
            a.href = `${node.url}/get/${lastFileId}`;
            a.textContent = `Download from node ${idx + 1} (${node.url})`;
            a.className = "download-link";
            a.setAttribute("target", "_blank");
            downloadLinks.appendChild(a);
          });
        }
      } catch (err) {
        console.error(err);
        nodesPre.textContent = "Error: " + err.message;
      }
    }

    refreshMetaBtn.addEventListener("click", (e) => {
      e.preventDefault();
      refreshMetadata();
    });

    refreshNodesBtn.addEventListener("click", (e) => {
      e.preventDefault();
      refreshNodes();
    });
  </script>
</body>
</html>
