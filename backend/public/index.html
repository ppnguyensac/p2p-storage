<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>P2P Storage Demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
        /* --- GLOBAL THEME --- */
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: radial-gradient(circle at top left, #0b0f19, #000);
            color: #e2e8f0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 32px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-weight: 700;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2.2rem;
            letter-spacing: 1px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            color: #e2e8f0;
            box-sizing: border-box;
            transition: 0.2s;
        }

            input[type="text"]:focus {
                outline: none;
                border-color: #6366f1;
                box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
            }

        /* --- BUTTONS (Web3 gradient style) --- */
        button {
            margin-top: 18px;
            padding: 12px 20px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            color: white;
            background: linear-gradient(135deg, #8b5cf6, #3b82f6, #06b6d4);
            background-size: 200% 200%;
            transition: 0.3s ease;
        }

            button:hover {
                transform: translateY(-2px);
                background-position: right;
                box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
            }

            button.secondary {
                background: rgba(255, 255, 255, 0.08);
                color: #93c5fd;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

                button.secondary:hover {
                    background: rgba(255, 255, 255, 0.15);
                    box-shadow: 0 0 12px rgba(255, 255, 255, 0.12);
                }

            button:disabled {
                opacity: 0.5;
                cursor: default;
                box-shadow: none;
                transform: none;
            }

        .section-title {
            margin-top: 28px;
            padding-bottom: 6px;
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        pre {
            background: rgba(15, 23, 42, 0.85);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            overflow-x: auto;
            font-size: 0.9rem;
            color: #e2e8f0;
        }

        .pill {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            background: linear-gradient(90deg, #6366f1, #3b82f6);
            color: #000915;
            margin-right: 6px;
            font-weight: 600;
        }

        a.download-link {
            display: inline-block;
            margin-top: 10px;
            margin-right: 12px;
            font-size: 0.9rem;
            color: #22c55e;
            font-weight: 600;
            text-decoration: none;
            transition: 0.25s;
        }

            a.download-link:hover {
                color: #67e8f9;
                text-shadow: 0 0 6px #67e8f9;
            }

        #status {
            margin-top: 10px;
            font-size: 0.95rem;
            min-height: 1.2em;
            font-weight: 600;
        }

        .error {
            color: #fb7185;
        }

        .success {
            color: #4ade80;
        }

        code {
            font-size: 0.85rem;
        }

        /* --- NODE HEALTH STYLES --- */
        .node-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }

        .node-card {
            flex: 1 1 260px;
            min-width: 240px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .node-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            box-shadow: 0 0 8px currentColor;
        }

        .status-online {
            background: rgba(22, 163, 74, 0.15);
            color: #22c55e;
            border: 1px solid rgba(74, 222, 128, 0.6);
        }

        .status-degraded {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(250, 204, 21, 0.6);
        }

        .status-offline {
            background: rgba(248, 113, 113, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.6);
        }

        .status-online .status-dot {
            color: #22c55e;
        }

        .status-degraded .status-dot {
            color: #facc15;
        }

        .status-offline .status-dot {
            color: #f97373;
        }

        .node-meta {
            font-size: 0.8rem;
            color: #9ca3af;
        }

            .node-meta strong {
                color: #e5e7eb;
            }

        .node-url {
            font-size: 0.8rem;
            color: #93c5fd;
            word-break: break-all;
        }

        .node-updated {
            font-size: 0.78rem;
            color: #6b7280;
            margin-top: 2px;
        }

        #nodeHealthStatus {
            margin-top: 6px;
            font-size: 0.8rem;
            color: #9ca3af;
        }

        /* File settings */
        .settings-panel {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }

            .settings-row input[type="number"] {
                width: 120px;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid rgba(255,255,255,0.08);
                background: rgba(255,255,255,0.02);
                color: #e2e8f0;
            }

        /* Popup modal */
        .popup-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .popup {
            background: #0f1724;
            color: #e2e8f0;
            padding: 18px;
            border-radius: 12px;
            max-width: 420px;
            width: calc(100% - 40px);
            box-shadow: 0 6px 30px rgba(0,0,0,0.6);
            border: 1px solid rgba(148,163,184,0.18);
        }

            .popup h3 {
                margin: 0 0 8px 0;
                font-size: 1.05rem;
            }

            .popup p {
                margin: 0 0 12px 0;
                color: #cbd5e1;
            }

            .popup .close-btn {
                display: inline-block;
                padding: 8px 12px;
                border-radius: 8px;
                background: rgba(255,255,255,0.06);
                border: none;
                color: #fff;
                cursor: pointer;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>P2P Storage + Blockchain Demo</h1>

        <!-- NODE HEALTH SECTION -->
        <div class="section-title">Node Health</div>
        <div id="nodeHealthStatus">Checking node status…</div>
        <div id="nodeHealthGrid" class="node-grid"></div>

        <!-- UPLOAD FORM -->
        <form id="uploadForm">
            <label for="owner">Owner address (Ganache account)</label>
            <input type="text"
                   id="owner"
                   placeholder="0x... (paste an account from ganache-cli)"
                   required />

            <label for="file">Choose file</label>
            <input type="file" id="file" required />

            <button type="submit" id="uploadBtn">Upload to P2P network</button>
        </form>

        <div id="status"></div>

        <div id="resultSection" style="display:none;">
            <div class="section-title">Last uploaded file</div>
            <p><span class="pill">File ID</span> <code id="fileIdText"></code></p>
            <p><span class="pill">File hash</span> <code id="fileHashText"></code></p>
            <p><span class="pill">Size</span> <span id="fileSizeText"></span> bytes</p>

            <button id="refreshMetaBtn" class="secondary">Refresh metadata</button>
            <button id="refreshNodesBtn" class="secondary">Refresh nodes</button>

            <!-- File settings button -->
            <button id="fileSettingsBtn" class="secondary" style="display:none;">File settings</button>

            <!-- Settings panel (hidden until File settings clicked) -->
            <div id="fileSettingsPanel" class="settings-panel" style="display:none;">
                <div>
                    <strong>Download limit</strong>
                </div>

                <div class="settings-row">
                    <label style="margin:0; font-weight:600;">
                        <input type="checkbox" id="downloadLimitToggle" /> Enable download limit
                    </label>
                </div>

                <div class="settings-row">
                    <label for="downloadLimitInput" style="margin:0;">Allowed downloads</label>
                    <input type="number" id="downloadLimitInput" min="1" step="1" disabled />
                </div>

                <div style="margin-top:12px;">
                    <button id="applySettingsBtn">Apply settings</button>
                    <button id="cancelSettingsBtn" class="secondary">Cancel</button>
                </div>

                <div id="settingsStatus" style="margin-top:8px; font-weight:600;"></div>
            </div>

            <div class="section-title">On-chain metadata</div>
            <pre id="metadataPre">{}</pre>

            <div class="section-title">Replica nodes</div>
            <pre id="nodesPre">{}</pre>

            <div id="downloadLinks"></div>
        </div>
    </div>

    <!-- Popup overlay (hidden by default) -->
    <div id="popupOverlay" class="popup-overlay" role="dialog" aria-hidden="true">
        <div class="popup" role="document">
            <h3 id="popupTitle">Notice</h3>
            <p id="popupMessage"></p>
            <div style="text-align:right;">
                <button id="popupClose" class="close-btn">Close</button>
            </div>
        </div>
    </div>

    <script>
        const uploadForm = document.getElementById("uploadForm");
        const ownerInput = document.getElementById("owner");
        const fileInput = document.getElementById("file");
        const uploadBtn = document.getElementById("uploadBtn");
        const statusEl = document.getElementById("status");

        const resultSection = document.getElementById("resultSection");
        const fileIdText = document.getElementById("fileIdText");
        const fileHashText = document.getElementById("fileHashText");
        const fileSizeText = document.getElementById("fileSizeText");
        const metadataPre = document.getElementById("metadataPre");
        const nodesPre = document.getElementById("nodesPre");
        const downloadLinks = document.getElementById("downloadLinks");
        const refreshMetaBtn = document.getElementById("refreshMetaBtn");
        const refreshNodesBtn = document.getElementById("refreshNodesBtn");

        const nodeHealthGrid = document.getElementById("nodeHealthGrid");
        const nodeHealthStatus = document.getElementById("nodeHealthStatus");

        const fileSettingsBtn = document.getElementById("fileSettingsBtn");
        const fileSettingsPanel = document.getElementById("fileSettingsPanel");
        const downloadLimitToggle = document.getElementById("downloadLimitToggle");
        const downloadLimitInput = document.getElementById("downloadLimitInput");
        const applySettingsBtn = document.getElementById("applySettingsBtn");
        const cancelSettingsBtn = document.getElementById("cancelSettingsBtn");
        const settingsStatus = document.getElementById("settingsStatus");

        const popupOverlay = document.getElementById("popupOverlay");
        const popupTitle = document.getElementById("popupTitle");
        const popupMessage = document.getElementById("popupMessage");
        const popupClose = document.getElementById("popupClose");

        let lastFileId = null;

        function setStatus(msg, type = "") {
            statusEl.textContent = msg;
            statusEl.className = type;
        }

        function showPopup(title, message) {
            popupTitle.textContent = title || "Notice";
            popupMessage.textContent = message || "";
            popupOverlay.style.display = "flex";
            popupOverlay.setAttribute("aria-hidden", "false");
        }

        function hidePopup() {
            popupOverlay.style.display = "none";
            popupOverlay.setAttribute("aria-hidden", "true");
        }

        popupClose.addEventListener("click", hidePopup);
        popupOverlay.addEventListener("click", (e) => {
            if (e.target === popupOverlay) hidePopup();
        });

        // ---------- NODE HEALTH ----------
        function classifyStatus(node) {
            if (!node.online) return "offline";
            if (node.latencyMs != null && node.latencyMs > 400) return "degraded";
            return "online";
        }

        function formatTime(ts) {
            if (!ts) return "n/a";
            const d = new Date(ts);
            return d.toLocaleTimeString();
        }

        async function fetchNodeHealth() {
            try {
                const res = await fetch("/nodes/status");
                const data = await res.json();

                if (!data.nodes || !Array.isArray(data.nodes)) {
                    nodeHealthStatus.textContent = "Unable to read node health.";
                    return;
                }

                nodeHealthStatus.textContent =
                    "Last updated: " + formatTime(data.checkedAt) + " (auto-refreshing)";

                nodeHealthGrid.innerHTML = "";

                data.nodes.forEach((node, idx) => {
                    const statusType = classifyStatus(node);
                    const card = document.createElement("div");
                    card.className = "node-card";

                    const header = document.createElement("div");
                    header.className = "node-header";

                    const title = document.createElement("div");
                    title.className = "node-title";
                    title.textContent = `Node ${idx + 1}`;

                    const pill = document.createElement("div");
                    pill.className = "status-pill status-" + statusType;

                    const dot = document.createElement("span");
                    dot.className = "status-dot";

                    const label = document.createElement("span");
                    if (statusType === "online") label.textContent = "Online";
                    else if (statusType === "degraded") label.textContent = "Degraded";
                    else label.textContent = "Offline";

                    pill.appendChild(dot);
                    pill.appendChild(label);

                    header.appendChild(title);
                    header.appendChild(pill);
                    card.appendChild(header);

                    const url = document.createElement("div");
                    url.className = "node-url";
                    url.textContent = node.url;
                    card.appendChild(url);

                    const meta = document.createElement("div");
                    meta.className = "node-meta";
                    const latency =
                        node.latencyMs != null ? `${node.latencyMs} ms` : "n/a";
                    meta.innerHTML =
                        "<strong>Latency:</strong> " +
                        latency +
                        " · <strong>Online:</strong> " +
                        (node.online ? "Yes" : "No");
                    card.appendChild(meta);

                    const updated = document.createElement("div");
                    updated.className = "node-updated";
                    updated.textContent = "Checked at: " + formatTime(node.lastChecked);
                    card.appendChild(updated);

                    nodeHealthGrid.appendChild(card);
                });
            } catch (err) {
                console.error("Node health error:", err);
                nodeHealthStatus.textContent =
                    "Error checking node status: " + err.message;
            }
        }

        // poll every 5 seconds
        setInterval(fetchNodeHealth, 5000);
        window.addEventListener("load", fetchNodeHealth);

        // ---------- UPLOAD HANDLING ----------
        uploadForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const owner = ownerInput.value.trim();
            const file = fileInput.files[0];

            if (!owner || !file) {
                setStatus("Owner address and file are required.", "error");
                return;
            }

            try {
                uploadBtn.disabled = true;
                setStatus("Uploading...", "");

                const formData = new FormData();
                formData.append("owner", owner);
                formData.append("file", file);

                const res = await fetch("/upload", {
                    method: "POST",
                    body: formData,
                });

                const data = await res.json();
                if (!res.ok || !data.ok) {
                    console.error("Upload error:", data);

                    let msg = data.error || "Unknown error";

                    if (data.code === "FILE_ALREADY_REGISTERED") {
                        msg =
                            "This exact file is already registered on-chain for that owner. Try a different file or a different owner address.";
                    } else if (data.code === "INVALID_OWNER") {
                        msg =
                            "Owner must be one of the Ganache accounts (copy it directly from the ganache-cli output).";
                    } else if (data.code === "MISSING_FILE") {
                        msg = "Please choose a file before uploading.";
                    } else if (data.code === "MISSING_OWNER") {
                        msg = "Please enter an owner address.";
                    }

                    setStatus("Upload failed: " + msg, "error");
                    uploadBtn.disabled = false;
                    return;
                }

                lastFileId = data.fileId;
                fileIdText.textContent = data.fileId;
                fileHashText.textContent = data.fileHash;
                fileSizeText.textContent = data.size;

                resultSection.style.display = "block";
                setStatus("Upload successful!", "success");

                // show File settings button now that a file exists
                fileSettingsBtn.style.display = "inline-block";

                await refreshMetadata();
                await refreshNodes();
            } catch (err) {
                console.error(err);
                setStatus("Upload failed: " + err.message, "error");
            } finally {
                uploadBtn.disabled = false;
            }
        });

        async function refreshMetadata() {
            if (!lastFileId) return;
            try {
                const res = await fetch(`/file/${lastFileId}`);
                const data = await res.json();
                metadataPre.textContent = JSON.stringify(data, null, 2);
            } catch (err) {
                console.error(err);
                metadataPre.textContent = "Error: " + err.message;
            }
        }

        // helper: download via fetch so we can intercept 410 and show popup
        async function downloadFromUrl(url, suggestedName) {
            try {
                const resp = await fetch(url);
                if (resp.status === 410) {
                    showPopup("Download blocked", "Download limit reached for this file on the node.");
                    return;
                }
                if (!resp.ok) {
                    // try to parse JSON message if available
                    let text = resp.statusText || `HTTP ${resp.status}`;
                    try {
                        const body = await resp.json();
                        if (body && body.error) text = body.error;
                    } catch (_) {
                        // ignore parse errors
                    }
                    showPopup("Download failed", text);
                    return;
                }

                const blob = await resp.blob();
                const blobUrl = URL.createObjectURL(blob);

                // create temporary anchor to download or open in new tab
                const a = document.createElement("a");
                a.href = blobUrl;
                // prefer suggestedName if available
                a.download = suggestedName || "";
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
            } catch (err) {
                console.error("download error:", err);
                showPopup("Download failed", err.message || "Network error");
            }
        }

        async function refreshNodes() {
            if (!lastFileId) return;
            try {
                const res = await fetch(`/file/${lastFileId}/nodes`);
                const data = await res.json();
                nodesPre.textContent = JSON.stringify(data, null, 2);

                downloadLinks.innerHTML = "";
                if (data.nodes && Array.isArray(data.nodes)) {
                    data.nodes.forEach((node, idx) => {
                        const a = document.createElement("a");
                        const href = `${node.url}/get/${lastFileId}`;
                        a.href = href;
                        a.textContent = `Download from node ${idx + 1} (${node.url})`;
                        a.className = "download-link";
                        // Intercept clicks so we can detect 410 and show an on-page popup
                        a.addEventListener("click", (ev) => {
                            ev.preventDefault();
                            downloadFromUrl(href, `${lastFileId}`);
                        });
                        downloadLinks.appendChild(a);
                    });
                }
            } catch (err) {
                console.error(err);
                nodesPre.textContent = "Error: " + err.message;
            }
        }

        refreshMetaBtn.addEventListener("click", (e) => {
            e.preventDefault();
            refreshMetadata();
        });

        refreshNodesBtn.addEventListener("click", (e) => {
            e.preventDefault();
            refreshNodes();
        });

        // ---------- FILE SETTINGS UI ----------
        fileSettingsBtn.addEventListener("click", (e) => {
            e.preventDefault();
            fileSettingsPanel.style.display = "block";
            // reset UI
            downloadLimitToggle.checked = false;
            downloadLimitInput.value = "";
            downloadLimitInput.disabled = true;
            settingsStatus.textContent = "";
        });

        cancelSettingsBtn.addEventListener("click", (e) => {
            e.preventDefault();
            fileSettingsPanel.style.display = "none";
            settingsStatus.textContent = "";
        });

        downloadLimitToggle.addEventListener("change", (e) => {
            downloadLimitInput.disabled = !downloadLimitToggle.checked;
            if (!downloadLimitToggle.checked) downloadLimitInput.value = "";
        });

        applySettingsBtn.addEventListener("click", async (e) => {
            e.preventDefault();
            if (!lastFileId) return;

            let downloadLimit = null;
            if (downloadLimitToggle.checked) {
                const val = Number(downloadLimitInput.value);
                if (!Number.isInteger(val) || val < 1) {
                    settingsStatus.textContent = "Enter a positive integer for the limit.";
                    settingsStatus.className = "error";
                    return;
                }
                downloadLimit = val;
            }

            settingsStatus.textContent = "Applying settings...";
            settingsStatus.className = "";

            try {
                const res = await fetch(`/file/${lastFileId}/settings`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ downloadLimit }),
                });

                const data = await res.json();
                if (!res.ok || !data.ok) {
                    console.error("Settings error:", data);
                    settingsStatus.textContent = "Failed to apply settings: " + (data.error || res.statusText);
                    settingsStatus.className = "error";
                    return;
                }

                settingsStatus.textContent = "Settings applied.";
                settingsStatus.className = "success";

                // refresh nodes and metadata to reflect new settings
                await refreshNodes();
                await refreshMetadata();
            } catch (err) {
                console.error(err);
                settingsStatus.textContent = "Failed to apply settings: " + err.message;
                settingsStatus.className = "error";
            }
        });
    </script>
</body>
</html>
